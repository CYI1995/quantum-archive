<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑体辐射｜温度与光谱交互实验</title>
<style>
:root{color-scheme:light;--ink:#304f63;--muted:#698294;--blue:#4d87a1;--warm:#b57b48;--line:#d9e4ec;--bg:#f6f9fb}
*{box-sizing:border-box}body{margin:0;padding:18px;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:950px;margin:0 auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
h1{margin:0;font-size:21px;font-weight:670}.tag{background:#fff;border:1px solid var(--line);border-radius:30px;padding:6px 10px;font-size:12px;color:var(--muted)}
.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:14px 18px;border-radius:12px;margin:0 0 10px}
.control{flex:1 1 360px}.control label{display:flex;justify-content:space-between;margin-bottom:7px;font-weight:600}.control output{font-variant-numeric:tabular-nums;color:#2a7197}input[type=range]{width:100%;accent-color:var(--blue)}.check{display:flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:10px}.metric{background:white;border:1px solid var(--line);border-radius:10px;padding:10px 14px}.metric small{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:22px;font-weight:670;line-height:1.45;font-variant-numeric:tabular-nums}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}.panel h2{font-size:15px;margin:0 0 3px}.sub{font-size:12px;margin:0 0 9px;color:var(--muted)}canvas{display:block;width:100%;height:300px;border-radius:6px}.legend{display:flex;gap:20px;flex-wrap:wrap;margin:5px 0 0;font-size:12px;color:var(--muted)}.key{display:inline-block;width:22px;height:3px;background:var(--blue);vertical-align:middle;margin-right:6px}.key.wien{background:var(--warm)}.key.rj{background:#988bb2;border-top:2px dashed #fff}
.info{font-size:12px;margin:11px 3px 0;color:var(--muted);line-height:1.65}
@media(max-width:640px){body{padding:10px}.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}.metric strong{font-size:18px}canvas{height:300px}.panel{padding:8px}}
</style>
</head>
<body>
<main class="wrap">
<header class="head"><h1>黑体辐射：改变温度会发生什么？</h1><span class="tag">普朗克定律 · 理论数值演示</span></header>
<div class="controls">
  <div class="control"><label for="temp">空腔温度 <output id="tval">4500 K</output></label><input id="temp" type="range" min="1500" max="7500" step="100" value="4500" aria-label="黑体温度"></div>
  <label class="check"><input type="checkbox" id="toggleRJ">比较经典瑞利–金斯</label>
  <label class="check"><input type="checkbox" id="toggleW" checked>比较维恩短波近似</label>
</div>
<section class="metrics" aria-label="物理计算结果">
 <div class="metric"><small>单位波长谱峰值</small><strong id="peak">—</strong></div>
 <div class="metric"><small>单位面积总出射度</small><strong id="power">—</strong></div>
 <div class="metric"><small>热能 kBT</small><strong id="kt">—</strong></div>
</section>
<section class="panel"><h2>谱辐亮度随波长变化</h2><p class="sub">纵轴采用当前温度下普朗克光谱的峰值归一化；不同温度的绝对强度请查看上方的总出射度。</p>
  <canvas id="chart" role="img" aria-label="黑体光谱图：横轴波长微米，纵轴归一化谱辐亮度"></canvas>
  <div class="legend"><span><i class="key"></i>普朗克（完整公式）</span><span><i class="key wien"></i>维恩（短波近似）</span><span><i class="key rj"></i>瑞利–金斯（经典）</span></div>
</section>
<p class="info">移动温度滑块，观察光谱峰位与 <i>T</i><sup>4</sup> 的关系。高温时峰值向短波移动。勾选经典曲线后可以看到在短波端的明显偏差。模型使用理想黑体、真空中光速与现行 SI 常数，不包含仪器响应和历史测量误差；横轴只显示 0.15–6.0 μm，纵轴已按普朗克曲线峰值缩放，超出绘图区的理论曲线被裁剪。</p>
</main>
<script>
(()=>{
 'use strict';
 const H=6.62607015e-34,K=1.380649e-23,C=299792458,SIG=5.670374419e-8,B=2.897771955e-3;
 const temp=document.getElementById('temp'), rj=document.getElementById('toggleRJ'), wien=document.getElementById('toggleW');
 const tval=document.getElementById('tval'),peak=document.getElementById('peak'),power=document.getElementById('power'),kt=document.getElementById('kt');
 const canvas=document.getElementById('chart'),ctx=canvas.getContext('2d');
 function spectral(lamUm,T,mode){
   const l=lamUm*1e-6,x=H*C/(l*K*T),constPre=2*H*C*C/Math.pow(l,5);
   if(mode==='rj')return 2*C*K*T/Math.pow(l,4);
   if(mode==='wien')return constPre*Math.exp(-x);
   return constPre/Math.expm1(x);
 }
 function render(){
   const T=+temp.value;
   tval.textContent=`${T.toLocaleString('zh-CN')} K`;
   peak.textContent=`${(B/T*1e6).toFixed(3)} μm`;
   let total=SIG*Math.pow(T,4);
   power.textContent=total>=1e6?`${(total/1e6).toFixed(2)} MW/m²`:`${(total/1e3).toFixed(2)} kW/m²`;
   kt.textContent=`${(K*T/1.602176634e-19).toFixed(3)} eV`;
   const dpr=Math.min(devicePixelRatio||1,2),rect=canvas.getBoundingClientRect();
   const W=Math.max(300,rect.width),Hh=Math.max(230,rect.height);
   canvas.width=Math.round(W*dpr);canvas.height=Math.round(Hh*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
   const left=56,right=14,top=20,bottom=42,ww=W-left-right,hh=Hh-top-bottom;
   const lmin=.15,lmax=6.0;
   let ymax=spectral(B/T*1e6,T,'planck');
   const X=l=>left+ww*(l-lmin)/(lmax-lmin),Y=v=>top+hh*(1-Math.min(1.2,v/ymax)/1.2);
   ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,Hh);
   ctx.font='11px -apple-system,"Noto Sans SC",sans-serif';ctx.textBaseline='middle';
   for(let i=0;i<=4;i++){
     let y=top+i*hh/4;ctx.strokeStyle='#e6eef3';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(W-right,y);ctx.stroke();
     ctx.fillStyle='#7d91a0';ctx.textAlign='right';ctx.fillText((1.2-.3*i).toFixed(1),left-9,y);
   }
   for(let l=.5;l<6.1;l+=.5){
     let x=X(l);ctx.strokeStyle='#edf1f4';ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+hh);ctx.stroke();
     if(Number.isInteger(l)){ctx.fillStyle='#7d91a0';ctx.textAlign='center';ctx.fillText(String(l),x,top+hh+19)}
   }
   ctx.fillStyle='#61798c';ctx.textAlign='left';ctx.fillText('相对谱辐亮度',left,9);
   ctx.textAlign='center';ctx.fillText('波长 λ（μm）',W/2,Hh-9);
   function plot(mode,color,dash,lineWidth){
     ctx.save();ctx.beginPath();ctx.rect(left,top,ww,hh);ctx.clip();ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=lineWidth;ctx.setLineDash(dash);ctx.lineJoin='round';
     for(let i=0;i<=800;i++){
       const l=lmin+(lmax-lmin)*i/800,x=X(l),y=Y(spectral(l,T,mode));
       if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
     }
     ctx.stroke();ctx.restore();
   }
   if(rj.checked)plot('rj','#988bb2',[7,5],2);
   if(wien.checked)plot('wien','#b57b48',[5,4],2);
   plot('planck','#4d87a1',[],3);
   const px=X(B/T*1e6),py=Y(ymax);
   if(px>=left&&px<=W-right){ctx.beginPath();ctx.arc(px,py,4.5,0,2*Math.PI);ctx.fillStyle='#4d87a1';ctx.fill();}
 }
 let frame=0;function schedule(){cancelAnimationFrame(frame);frame=requestAnimationFrame(render)}
 for(const x of [temp,rj,wien])x.addEventListener('input',schedule);
 window.addEventListener('resize',schedule);
 render();
})();
</script>
</body></html>
